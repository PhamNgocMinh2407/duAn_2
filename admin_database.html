<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách tài khoản đã đăng ký</title>
    
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="db-card">
        <h2>Dữ liệu hệ thống (LocalStorage)</h2>
        <p>Đây là trang riêng lưu trữ tất cả thông tin đăng ký để đối soát đăng nhập.</p>
        
        <table id="userTable">
            <thead>
                <tr>
                    <th>Họ tên</th>
                    <th>Số điện thoại</th>
                    <th>Email</th>
                    <th>Mật khẩu</th>
                    <th>Ngày sinh</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="userListData">
                
            </tbody>
        </table>
        
        <br>
        <button class="btn-back" onclick="window.location.href='login.html'">Quay lại Đăng nhập</button>
    </div>

    <script>
        function loadUsers() {
         
            const users = JSON.parse(localStorage.getItem('userAccounts')) || [];
            const tableBody = document.getElementById('userListData');
            tableBody.innerHTML = '';

            users.forEach((user, index) => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${user.fullName || 'N/A'}</td>
                        <td>${user.phone || 'N/A'}</td>
                        <td>${user.email || 'N/A'}</td>
                        <td><code>${user.password}</code></td>
                        <td>${user.dob || 'N/A'}</td>
                        <td><button class="btn-delete" onclick="deleteUser(${index})">Xóa</button></td>
                    </tr>
                `;
            });
        }

        function deleteUser(index) {
            if(confirm("Bạn có chắc muốn xóa tài khoản này? Người này sẽ không thể đăng nhập được nữa.")) {
                let users = JSON.parse(localStorage.getItem('userAccounts')) || [];
                users.splice(index, 1);
                localStorage.setItem('userAccounts', JSON.stringify(users));
                loadUsers(); 
            }
        }

        
        window.onload = loadUsers;
    </script>
</body>
</html>
